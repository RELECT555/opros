# ============================================================
# OPROS — полный стек для самохостинга
# Запуск: docker compose up -d
# ============================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       opros
      POSTGRES_USER:     opros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opros"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js API ─────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:    postgresql://opros:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/opros
      ADMIN_PASSWORD:  ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET:      ${JWT_SECRET:?JWT_SECRET of at least 32 characters is required}
      TRUST_PROXY:     172.30.44.10
      SUPABASE_URL:    ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      FRONTEND_URL:    ${FRONTEND_URL:-http://localhost:5173}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:   ${TELEGRAM_CHAT_ID:-}
      PORT:            3001
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:3001:3001"

  # ── Frontend (статика через nginx) ──────────────────────────
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./survey/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      default:
        ipv4_address: 172.30.44.10

volumes:
  postgres_data:
  uploads_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.44.0/24
